[package]
name = "audio-verifier-host"
description = "Parent-instance gateway that streams R2 downloads into the audio verifier enclave"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "FSL-1.1-ALv2"
publish = false
repository = "https://github.com/misofm/audio-verifier-enclave"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
bytes = "1.10.1"
futures-util = { version = "0.3.31", default-features = false }
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.4"

[dev-dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
