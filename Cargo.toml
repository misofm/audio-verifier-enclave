[workspace]
members = ["crates/libflac", "crates/audio-verifier", "crates/audio-verifier-enclave"]
exclude = ["host/gateway"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "FSL-1.1-ALv2"
publish = false
repository = "https://github.com/misofm/audio-verifier-enclave"

[workspace.dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
audio-verifier = { path = "crates/audio-verifier" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bcs = "0.1.6"
blake3 = "1.8.2"
cc = "1.2.62"
futures-util = "0.3.31"
hex = "0.4.3"
hkdf = "0.12.4"
libflac = { path = "crates/libflac" }
md-5 = "0.10.6"
# fastcrypto at the revision seal-crypto pins, for its BLS12-381 public key type.
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "076bf5ad8cea140dc7cf5c5861c24a36acdf64ce" }
nautilus = { git = "https://github.com/unconfirmedlabs/nautilus-rust", rev = "d74178b0aab4a669394925449befa4ce6a15abdb" }
rand = "0.8.5"
# Seal's `crypto` crate at seal-v0.6.16.
seal-crypto = { git = "https://github.com/MystenLabs/seal", rev = "54eff6a7621b9b45905876a4ffd3e675e03a9bfc", package = "crypto" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
# walrus-core at testnet-v1.60.2 (also mainnet-v1.60.2).
walrus-core = { git = "https://github.com/MystenLabs/walrus", rev = "29c3d1a429d5284e4ca2473bf037236789cdd503" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.libflac]
opt-level = 3
